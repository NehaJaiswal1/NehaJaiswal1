<svg width="1280" height="320" viewBox="0 0 1280 320" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- Background gradient: dark navy to black -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1330"/>
      <stop offset="45%" stop-color="#060c22"/>
      <stop offset="100%" stop-color="#020409"/>
    </linearGradient>

    <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2f8bff" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#1a5fd0" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1a5fd0" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38e0ff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38e0ff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="rackFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16244d"/>
      <stop offset="100%" stop-color="#0b1430"/>
    </linearGradient>
    <linearGradient id="rackSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a1230"/>
      <stop offset="100%" stop-color="#050a1c"/>
    </linearGradient>
    <linearGradient id="rackTop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1c2f5f"/>
      <stop offset="100%" stop-color="#12224a"/>
    </linearGradient>

    <linearGradient id="dbGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e63c9"/>
      <stop offset="100%" stop-color="#0c3a86"/>
    </linearGradient>

    <linearGradient id="cloudGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a5cc0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#12336f" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="headline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a9c9ff"/>
    </linearGradient>

    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38e0ff"/>
      <stop offset="100%" stop-color="#2f6bff"/>
    </linearGradient>

    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="softBig" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="glowLine" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Circuit tile pattern -->
    <pattern id="circuit" width="70" height="70" patternUnits="userSpaceOnUse">
      <g stroke="#1f4a9a" stroke-width="1" fill="none" opacity="0.5">
        <path d="M0 20 H30 V0 M30 20 V50 H70 M50 50 V70 M20 70 V45 H0"/>
        <path d="M45 0 V30 H70"/>
      </g>
      <g fill="#2f7bff" opacity="0.7">
        <circle cx="30" cy="20" r="2.2"/>
        <circle cx="30" cy="50" r="2.2"/>
        <circle cx="45" cy="30" r="2.2"/>
        <circle cx="20" cy="45" r="2.2"/>
      </g>
    </pattern>
  </defs>

  <!-- Base -->
  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#circuit)" opacity="0.35"/>

  <!-- Ambient glows -->
  <ellipse cx="330" cy="150" rx="360" ry="260" fill="url(#glowBlue)"/>
  <ellipse cx="150" cy="290" rx="280" ry="160" fill="url(#glowCyan)"/>
  <ellipse cx="1050" cy="90" rx="300" ry="220" fill="url(#glowBlue)" opacity="0.7"/>

  <!-- Subtle grid floor -->
  <g stroke="#1b3d7a" stroke-width="1" opacity="0.25">
    <path d="M0 265 H1280"/>
    <path d="M0 288 H1280"/>
  </g>

  <!-- ================= NETWORK CONNECTIONS ================= -->
  <g stroke-width="1.6" fill="none" opacity="0.85" filter="url(#glowLine)">
    <path d="M235 120 C 330 90, 430 120, 520 110" stroke="#2f8bff" stroke-opacity="0.7"/>
    <path d="M235 165 C 340 175, 430 150, 540 170" stroke="#38e0ff" stroke-opacity="0.6"/>
    <path d="M120 210 C 250 240, 400 220, 520 235" stroke="#2f8bff" stroke-opacity="0.6"/>
    <path d="M470 70 C 500 130, 470 190, 520 205" stroke="#38e0ff" stroke-opacity="0.5"/>
  </g>
  <g fill="#7ad4ff">
    <circle cx="520" cy="110" r="3.2"/>
    <circle cx="540" cy="170" r="3.2"/>
    <circle cx="520" cy="235" r="3.2"/>
    <circle cx="235" cy="120" r="3"/>
    <circle cx="235" cy="165" r="3"/>
  </g>

  <!-- ================= CLOUD COMPUTING ================= -->
  <g transform="translate(430,58)">
    <g filter="url(#soft)" opacity="0.9">
      <path d="M22 44 a22 22 0 0 1 3 -43 a26 26 0 0 1 48 8 a20 20 0 0 1 4 39 z"
            fill="url(#cloudGrad)" stroke="#4f9bff" stroke-width="1.5"/>
    </g>
    <g stroke="#8fd0ff" stroke-width="1.4" fill="none" opacity="0.85">
      <path d="M50 44 V60"/>
      <circle cx="50" cy="66" r="3.4" fill="#8fd0ff"/>
    </g>
    <text x="50" y="30" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#bfe0ff" text-anchor="middle" font-weight="700">CLOUD</text>
  </g>

  <!-- ================= 3D SERVER RACK ================= -->
  <g transform="translate(60,70)">
    <!-- shadow -->
    <ellipse cx="120" cy="212" rx="120" ry="16" fill="#000" opacity="0.45" filter="url(#soft)"/>

    <!-- top -->
    <path d="M20 8 L150 8 L188 32 L58 32 Z" fill="url(#rackTop)" stroke="#2e5bb0" stroke-width="1"/>
    <!-- side -->
    <path d="M150 8 L188 32 L188 200 L150 178 Z" fill="url(#rackSide)" stroke="#20407e" stroke-width="1"/>
    <!-- front -->
    <rect x="20" y="8" width="130" height="170" rx="4" fill="url(#rackFront)" stroke="#2e5bb0" stroke-width="1.4"/>

    <!-- server units -->
    <g>
      <!-- reusable unit look -->
      <g transform="translate(30,22)">
        <rect width="110" height="22" rx="3" fill="#0f1e42" stroke="#274d97" stroke-width="1"/>
        <circle cx="14" cy="11" r="3.4" fill="#38e0ff" filter="url(#glowLine)"/>
        <rect x="26" y="7" width="46" height="3" rx="1.5" fill="#1f4a9a"/>
        <rect x="26" y="13" width="34" height="3" rx="1.5" fill="#1f4a9a"/>
        <rect x="90" y="6" width="10" height="10" rx="2" fill="#123a86"/>
      </g>
      <g transform="translate(30,50)">
        <rect width="110" height="22" rx="3" fill="#0f1e42" stroke="#274d97" stroke-width="1"/>
        <circle cx="14" cy="11" r="3.4" fill="#5cff9d" filter="url(#glowLine)"/>
        <rect x="26" y="7" width="46" height="3" rx="1.5" fill="#1f4a9a"/>
        <rect x="26" y="13" width="30" height="3" rx="1.5" fill="#1f4a9a"/>
        <rect x="90" y="6" width="10" height="10" rx="2" fill="#123a86"/>
      </g>
      <g transform="translate(30,78)">
        <rect width="110" height="22" rx="3" fill="#0f1e42" stroke="#274d97" stroke-width="1"/>
        <circle cx="14" cy="11" r="3.4" fill="#38e0ff" filter="url(#glowLine)"/>
        <rect x="26" y="7" width="46" height="3" rx="1.5" fill="#1f4a9a"/>
        <rect x="26" y="13" width="38" height="3" rx="1.5" fill="#1f4a9a"/>
        <rect x="90" y="6" width="10" height="10" rx="2" fill="#123a86"/>
      </g>
      <g transform="translate(30,106)">
        <rect width="110" height="22" rx="3" fill="#0f1e42" stroke="#274d97" stroke-width="1"/>
        <circle cx="14" cy="11" r="3.4" fill="#ffb347" filter="url(#glowLine)"/>
        <rect x="26" y="7" width="46" height="3" rx="1.5" fill="#1f4a9a"/>
        <rect x="26" y="13" width="26" height="3" rx="1.5" fill="#1f4a9a"/>
        <rect x="90" y="6" width="10" height="10" rx="2" fill="#123a86"/>
      </g>
      <g transform="translate(30,134)">
        <rect width="110" height="22" rx="3" fill="#0f1e42" stroke="#274d97" stroke-width="1"/>
        <circle cx="14" cy="11" r="3.4" fill="#38e0ff" filter="url(#glowLine)"/>
        <rect x="26" y="7" width="46" height="3" rx="1.5" fill="#1f4a9a"/>
        <rect x="26" y="13" width="34" height="3" rx="1.5" fill="#1f4a9a"/>
        <rect x="90" y="6" width="10" height="10" rx="2" fill="#123a86"/>
      </g>
    </g>
  </g>

  <!-- ================= DATABASE ILLUSTRATION ================= -->
  <g transform="translate(250,150)">
    <g filter="url(#soft)"><ellipse cx="45" cy="96" rx="46" ry="12" fill="#000" opacity="0.4"/></g>
    <g stroke="#5fb0ff" stroke-width="1.5">
      <path d="M2 14 v66 a43 12 0 0 0 86 0 v-66" fill="url(#dbGrad)"/>
      <ellipse cx="45" cy="14" rx="43" ry="12" fill="#2a72d8"/>
      <path d="M2 36 a43 12 0 0 0 86 0" fill="none" opacity="0.8"/>
      <path d="M2 58 a43 12 0 0 0 86 0" fill="none" opacity="0.8"/>
    </g>
    <ellipse cx="45" cy="14" rx="43" ry="12" fill="none" stroke="#9fd0ff" stroke-width="1" opacity="0.6"/>
    <text x="45" y="18" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#dff0ff" text-anchor="middle" font-weight="700">DB</text>
  </g>

  <!-- ================= MICROSERVICES ARCHITECTURE ================= -->
  <g transform="translate(360,168)">
    <g stroke="#2f8bff" stroke-width="1.4" opacity="0.7" fill="none">
      <path d="M40 22 L110 6"/>
      <path d="M40 22 L112 40"/>
      <path d="M40 22 L96 78"/>
      <path d="M110 6 L112 40"/>
    </g>
    <!-- hex nodes -->
    <g>
      <g transform="translate(24,6)"><path d="M16 0 L32 9 V27 L16 36 L0 27 V9 Z" fill="#123a86" stroke="#4f9bff" stroke-width="1.4"/><text x="16" y="22" font-family="Segoe UI,Arial" font-size="9" fill="#bfe0ff" text-anchor="middle" font-weight="700">svc</text></g>
      <g transform="translate(96,-8)"><path d="M14 0 L28 8 V24 L14 32 L0 24 V8 Z" fill="#0f2a63" stroke="#4f9bff" stroke-width="1.2"/></g>
      <g transform="translate(98,26)"><path d="M14 0 L28 8 V24 L14 32 L0 24 V8 Z" fill="#0f2a63" stroke="#4f9bff" stroke-width="1.2"/></g>
      <g transform="translate(80,64)"><path d="M14 0 L28 8 V24 L14 32 L0 24 V8 Z" fill="#0f2a63" stroke="#4f9bff" stroke-width="1.2"/></g>
    </g>
  </g>

  <!-- ================= API FLOW ================= -->
  <g transform="translate(300,60)">
    <rect x="0" y="0" width="150" height="34" rx="8" fill="#0c1c44" stroke="#2f6bff" stroke-width="1.3"/>
    <circle cx="18" cy="17" r="6" fill="#38e0ff" filter="url(#glowLine)"/>
    <text x="34" y="15" font-family="Consolas, monospace" font-size="10.5" fill="#8fd0ff" font-weight="700">GET /api/v1</text>
    <text x="34" y="27" font-family="Consolas, monospace" font-size="9" fill="#5f8fd0">200 OK · JSON</text>
    <g stroke="#38e0ff" stroke-width="1.5" fill="none" opacity="0.8">
      <path d="M150 17 h34" marker-end="url(#arrow)"/>
    </g>
  </g>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 z" fill="#38e0ff"/>
    </marker>
  </defs>

  <!-- ================= CODE SNIPPET ================= -->
  <g transform="translate(470,120)">
    <rect x="0" y="0" width="196" height="118" rx="10" fill="#070f24" stroke="#1f3f7e" stroke-width="1.3" opacity="0.96"/>
    <g transform="translate(12,12)">
      <circle cx="0" cy="0" r="3.2" fill="#ff5f56"/>
      <circle cx="12" cy="0" r="3.2" fill="#ffbd2e"/>
      <circle cx="24" cy="0" r="3.2" fill="#27c93f"/>
    </g>
    <g font-family="Consolas, 'Courier New', monospace" font-size="10" xml:space="preserve">
      <text x="12" y="36"><tspan fill="#c678dd">const</tspan><tspan fill="#61afef"> app</tspan><tspan fill="#abb2bf"> = express();</tspan></text>
      <text x="12" y="54"><tspan fill="#c678dd">app</tspan><tspan fill="#abb2bf">.get(</tspan><tspan fill="#98c379">'/health'</tspan><tspan fill="#abb2bf">, (req,res)=&gt;{</tspan></text>
      <text x="12" y="72"><tspan fill="#abb2bf">  res.</tspan><tspan fill="#61afef">json</tspan><tspan fill="#abb2bf">({ ok: </tspan><tspan fill="#d19a66">true</tspan><tspan fill="#abb2bf"> });</tspan></text>
      <text x="12" y="90"><tspan fill="#abb2bf">});</tspan></text>
      <text x="12" y="108"><tspan fill="#c678dd">await</tspan><tspan fill="#abb2bf"> db.</tspan><tspan fill="#61afef">connect</tspan><tspan fill="#abb2bf">();</tspan></text>
    </g>
  </g>

  <!-- ================= VERTICAL DIVIDER GLOW ================= -->
  <rect x="742" y="40" width="1.4" height="240" fill="url(#accentLine)" opacity="0.35"/>

  <!-- ================= RIGHT SIDE CONTENT ================= -->
  <g transform="translate(790,0)">
    <!-- eyebrow -->
    <g transform="translate(0,86)">
      <rect x="0" y="-11" width="30" height="3" rx="1.5" fill="url(#accentLine)"/>
      <text x="42" y="0" font-family="Segoe UI, Arial, sans-serif" font-size="13" letter-spacing="4" fill="#5f9bff" font-weight="700">BACKEND · ENGINEERING</text>
    </g>

    <!-- Title -->
    <text x="0" y="148" font-family="Segoe UI, Arial, sans-serif" font-size="48" font-weight="800" fill="url(#headline)" letter-spacing="0.5">Backend Developer</text>

    <!-- Subtitle -->
    <text x="2" y="188" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#9fb6d8">Building Scalable &amp; Reliable Backend Systems</text>

    <!-- Tech logos row -->
    <g transform="translate(2,222)" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700">
      <!-- Node.js -->
      <g transform="translate(0,0)">
        <rect width="86" height="34" rx="8" fill="#0d1c30" stroke="#2e6b3e" stroke-width="1.2"/>
        <path transform="translate(12,7) scale(0.9)" d="M11 0 L21 6 V17 L11 23 L1 17 V6 Z" fill="#3c873a"/>
        <text x="34" y="22" fill="#cfe8d2">Node.js</text>
      </g>
      <!-- NestJS -->
      <g transform="translate(96,0)">
        <rect width="84" height="34" rx="8" fill="#1a0d14" stroke="#7e2b45" stroke-width="1.2"/>
        <circle cx="20" cy="17" r="8.5" fill="none" stroke="#e0234e" stroke-width="2.4"/>
        <text x="36" y="22" fill="#f2b6c4">NestJS</text>
      </g>
      <!-- MongoDB -->
      <g transform="translate(190,0)">
        <rect width="104" height="34" rx="8" fill="#0d1f14" stroke="#2e6b3e" stroke-width="1.2"/>
        <path transform="translate(15,7)" d="M6 20 C-2 12 2 4 6 0 C10 4 14 12 6 20 Z" fill="#4faa41"/>
        <text x="30" y="22" fill="#cfe8d2">MongoDB</text>
      </g>
      <!-- Redis -->
      <g transform="translate(304,0)">
        <rect width="78" height="34" rx="8" fill="#2a0e0b" stroke="#8f3327" stroke-width="1.2"/>
        <g transform="translate(12,10)"><path d="M0 3 L10 0 L20 3 L10 6 Z" fill="#d82c20"/><path d="M0 8 L10 5 L20 8 L10 11 Z" fill="#a52016"/></g>
        <text x="38" y="22" fill="#f2c1bc">Redis</text>
      </g>
      <!-- RabbitMQ -->
      <g transform="translate(390,0)">
        <rect width="104" height="34" rx="8" fill="#2a1605" stroke="#a85a12" stroke-width="1.2"/>
        <g transform="translate(13,9)"><rect x="0" y="0" width="16" height="16" rx="2" fill="#ff6600"/><rect x="4" y="-4" width="3" height="6" fill="#ff6600"/><rect x="10" y="-4" width="3" height="6" fill="#ff6600"/></g>
        <text x="34" y="22" fill="#ffd3a6">RabbitMQ</text>
      </g>
    </g>
    <g transform="translate(2,262)" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700">
      <!-- Docker -->
      <g transform="translate(0,0)">
        <rect width="90" height="34" rx="8" fill="#0a1b2e" stroke="#1f6fb0" stroke-width="1.2"/>
        <g transform="translate(12,12)" fill="#2496ed"><rect x="0" y="4" width="5" height="5"/><rect x="6" y="4" width="5" height="5"/><rect x="12" y="4" width="5" height="5"/><rect x="6" y="-2" width="5" height="5"/><path d="M0 9 h22 a6 6 0 0 1 -8 5 h-8 a8 8 0 0 1 -6 -5 Z"/></g>
        <text x="34" y="22" fill="#b6dcf5">Docker</text>
      </g>
      <!-- AWS -->
      <g transform="translate(100,0)">
        <rect width="72" height="34" rx="8" fill="#241705" stroke="#a8791a" stroke-width="1.2"/>
        <text x="14" y="22" fill="#ff9900" font-size="14" font-weight="800">aws</text>
        <path d="M46 24 c8 4 14 4 20 0" stroke="#ff9900" stroke-width="2" fill="none"/>
      </g>
    </g>
  </g>

  <!-- Corner accents -->
  <path d="M1240 20 h20 v20" fill="none" stroke="#2f6bff" stroke-width="1.4" opacity="0.5"/>
  <path d="M20 300 h20 M20 300 v-20" fill="none" stroke="#2f6bff" stroke-width="1.4" opacity="0.5"/>
</svg>
